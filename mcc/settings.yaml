default:
  auth: "dev-admin"
  tools: []

  # Dev-mode switch. When true: forces the mcc logger to DEBUG level (overriding
  # whatever the active environment's logging.loggers.mcc.level says), and lets
  # full Python tracebacks from failed fn tools (pyrunner subprocesses) pass
  # through to the LLM. When false (default), those tracebacks are reduced to
  # just the exception's type and message before being returned, so source
  # file paths, line numbers, and code context are never leaked to the LLM.
  debug: false

  # Environment variables always exposed to tool subprocesses, regardless of a
  # tool's env_passthrough setting (including env_passthrough: false). These are
  # "machine works" basics, never secrets. A name is only passed through if it
  # is present in the server process environment.
  env_floor:
    - PATH
    - HOME
    - USER
    - LOGNAME
    - TMPDIR
    - LANG
    - LC_ALL
    - TZ
    - TERM
    - SHELL

  cache:
    backend: "mem://"
    search_ttl: 60

  # Per-user, per-catalog-tool call-rate limiting for execute(), enforced by
  # RateLimitMiddleware (mcc/middleware.py). Disabled by default so existing
  # deployments are unaffected until an operator opts in. Fixed window,
  # keyed per user per tool key (e.g. "admin.shell") — resets after the
  # first call in a window. Each value is either:
  #   - "<count>/<n><unit>", unit one of s|min|hr, e.g. "60/1min", "50/24hr",
  #     "10/30s"
  #   - -1, meaning unlimited for that tool (skips the counter entirely)
  # Only applies to catalog tools reached via execute(); search/whoami/etc.
  # are never limited. Counters live in the same backend as cache.backend
  # above (mem:// by default) — on multiple pods without a shared redis://
  # backend, each pod tracks its own counters, so the effective limit is
  # configured_limit * pod_count.
  rate_limit:
    enabled: false
    default: "60/1min"
    tools: {}

  embedding_model: "BAAI/bge-small-en-v1.5"
  embedding_dims: 384

  server:
    transport: streamable-http
    port: 8000
    host: 0.0.0.0
    response_max_size: 5000000

  # Backend for the streamable-http EventStore (stream resumability across
  # reconnects/restarts via Mcp-Session-Id + Last-Event-ID replay). Same URI
  # convention as cache.backend: "mem://" (default, in-process only - fine
  # for one instance, but a reconnect to a different pod can't resume) or
  # "redis://host:port/db" to survive pod restarts.
  event_store:
    backend: "mem://"

  # Overrides the server name/icon/link shown on the FastMCP OAuth consent
  # screen and error pages. Falls through to FastMCP's own defaults if unset.
  branding:
    name: ""
    website_url: ""
    icon_url: ""

  # Optional built-in web UI: a static SPA served at /ui that browses/searches
  # the catalog and calls tools via the existing HTTP routes only. Off by
  # default, like contrib tools. Serving it also requires mcc/static/ui/index.html
  # to exist (built via `make ui`) — if enabled but not built, /ui just 404s
  # (with a logged warning) rather than failing startup.
  ui_enabled: false

  # Storage/search backend for UsersIndex, KeysIndex, and ToolIndex. Read once
  # at process start — not switchable at runtime. "opensearch" requires the
  # mcc[opensearch] extra to be installed.
  search_backend: "elasticsearch"

  elasticsearch_url: "http://localhost:9200"
  opensearch_url: "http://localhost:9200"
  user_index: "mcc-users"
  tool_index: "mcc-tools"
  key_index: "mcc-keys"

  # Persisted audit trail of catalog tool calls (see mcc/audit.py). Empty (the
  # default) disables auditing entirely — no hook is registered, nothing is
  # written. Any non-empty value both enables auditing and names the index.
  audit_tool_index: ""

  # Whether audit records include the call's visible parameters, serialized
  # as "key=var;key=var" text. Only affects the params field — username, tool
  # key, duration, and status/error are always recorded when auditing is on.
  audit_params: true

  # Persisted audit trail of search() calls (see mcc/audit.py). Empty (the
  # default) disables search auditing entirely — nothing is written. Any
  # non-empty value both enables it and names the index. Independent of
  # audit_tool_index — either can be enabled without the other.
  audit_search_index: ""

  api_key:
    default_ttl_days: 90

  oauth:
    base_url: "http://localhost:8000"
    client_id: ""
    client_secret: ""
    audience: ""                     # auth0, jwt
    verify_id_token: false           # auth0, aws, oci (any OIDCProxy-based provider)
    config_url: ""                   # auth0, oci, descope
    tenant_id: ""                    # azure
    domain: ""                       # clerk
    authkit_domain: ""               # workos
    user_pool_id: ""                 # aws
    aws_region: ""                   # aws
    project_url: ""                  # supabase
    environment_url: ""              # scalekit
    resource_id: ""                  # scalekit
    auth_url: ""                     # propelauth
    introspection_client_id: ""      # propelauth
    introspection_client_secret: ""  # propelauth
    project_id: ""                   # descope
    consent_csp_policy: ""            # any OAuthProxy/OIDCProxy-based provider; "" keeps FastMCP's built-in policy
    # Storage for DCR client registrations (and upstream tokens/transactions/codes)
    # on any OAuthProxy/OIDCProxy-based provider. "" (default) falls back to
    # cache.backend, so a redis:// cache.backend already covers this with no
    # extra config. Only set this if oauth state needs a different backend than
    # the tool-call cache. On an ephemeral pod filesystem with no redis backend,
    # FastMCP falls back to its own encrypted file store scoped to a directory
    # under settings.home — a restart/redeploy wipes it and every client that
    # already completed DCR gets "client ID was not found in the server's client
    # registry" until it re-registers.
    client_storage_backend: ""
    # "external" skips FastMCP's own consent screen — Auth0's login is treated
    # as sufficient authorization. Set to true to re-enable FastMCP's consent
    # screen, or false to skip it without the "handled elsewhere" warning
    # suppression (dev only — see FastMCP's own docstring warning on this).
    require_authorization_consent: "external"

  jwt:
    jwks_uri: ""
    issuer: ""
    audience: ""
    authorization_server: ""
    base_url: "http://localhost:8000"
    required_scopes: []

  logging:
    version: 1
    disable_existing_loggers: false
    formatters:
      standard:
        format: "%(levelname)s [%(name)s] %(message)s"
      verbose:
        format: "%(asctime)s %(levelname)s [%(name)s] %(message)s"
    handlers:
      console:
        class: "logging.StreamHandler"
        formatter: "standard"
    loggers:
      mcc:
        level: "WARNING"
        handlers:
          - "console"
        propagate: false

development:
  dynaconf_merge: true

  logging:
    loggers:
      mcc:
        level: "DEBUG"

production:
  dynaconf_merge: true

  embedding_model: "snowflake/snowflake-arctic-embed-m"
  embedding_dims: 768

  logging:
    handlers:
      console:
        formatter: "verbose"
    loggers:
      mcc:
        level: "INFO"

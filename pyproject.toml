[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "model-context-catalog"
dynamic = ["version"]
description = "An MCP server that exposes Python functions and shell commands as a permission-controlled tool catalog."
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "dynaconf>=3.0",
    "elasticsearch[async]>=8,<9",
    "fastembed>=0.4.0",
    "fastmcp>=3.2.0",
    "envyaml>=1.10",
    "rich-click>=1.8",
    "aiofiles>=25.1.0",
    "jinja2>=3.1.6",
    "cashews>=7.5.0",
]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    'Intended Audience :: Developers',
    'Operating System :: OS Independent',
    'Programming Language :: Python',
    'Topic :: Software Development :: Libraries :: Python Modules',
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
[project.urls]
Homepage = "https://c-research.github.io/model-context-catalog/"
Documentation = "https://c-research.github.io/model-context-catalog/"
Repository = "https://github.com/C-Research/model-context-catalog"
Issues = "https://github.com/C-Research/model-context-catalog/issues"

[project.optional-dependencies]
osint = [
    "sherlock-project>=0.14.3",
    "gdeltdoc>=1.4.0",
]
opensearch = [
    "opensearch-py[async]>=2.4.0",
]
scraping = [
    "scrapling[fetchers]>=0.4.14",
]

[project.scripts]
mcc = "mcc.cli:cli"

[tool.setuptools.dynamic]
version = { attr = "mcc.__version__" }

[tool.setuptools.packages.find]
include = ["mcc*"]

[tool.setuptools.package-data]
mcc = ["settings.yaml", "tools/*.yaml", "templates/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "smoke: fast tests that do not spawn subprocesses or hit external services",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build"]
# B404 (subprocess import) is purely informational noise: subprocess-based sandboxed
# execution is core to mcc's tool-runner model. Individual subprocess.run call sites
# are still checked (B603) and `# nosec`-annotated with justification where safe.
skips = ["B404"]

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "zensical>=0.0.31",
    "pyright>=1.1.408",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.3.0",
    "types-aiofiles>=25.1.0.20251011",
    "bandit>=1.9.4",
]

[tool.uv]
# Security floors for transitive dependencies (Dependabot alerts).
# Constraints apply only when the package is in the resolution tree;
# they do not add it as a direct dependency. Prune lines that become
# redundant once a real dependency requires the patched version itself.
constraint-dependencies = [
    "authlib>=1.7.2",              # open redirect, CSRF
    "starlette>=1.3.1",           # Host header validation bypass
    "aiohttp>=3.14.3",            # deserialization, cross-origin redirect
    "idna>=3.15",                 # IDNA encode bypass
    "pymdown-extensions>=11.0.1", # path traversal, ReDoS
    "urllib3>=2.7.0",             # header leak, decompression bomb
    "python-multipart>=0.0.27",   # DoS via multipart headers
    "cryptography>=50.0.0",       # buffer overflow
    "pillow>=12.3.0",             # multiple CVEs
    "mcp>=1.28.1",                # multiple CVEs
]
